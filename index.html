<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>중학생활 꿀팁 웹툰</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e5e7eb;--text:#222;--muted:#737987;--point:#6c63ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:14px 16px}
.bar{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800}
.wrap{max-width:760px;margin:auto;padding:22px 16px 60px}
.hero h1{margin:0 0 8px;font-size:28px}
.hero p{margin:0 0 22px;color:var(--muted);line-height:1.6}
.list{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.card.coming{opacity:.55;pointer-events:none}
.thumb{width:92px;height:92px;object-fit:cover;border-radius:14px;background:#eceef3;flex:0 0 auto}
.meta{flex:1;min-width:0}
.label{font-size:13px;color:var(--point);font-weight:800}
.title{font-size:17px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:13px;color:var(--muted);margin-top:7px}
.viewer{max-width:860px;margin:auto}
.viewerbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:11px 12px}
.viewerrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.viewer-title{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;gap:7px}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}
button.active{background:var(--point);border-color:var(--point);color:#fff}
.progress{text-align:center;color:var(--muted);font-size:13px;margin-top:7px}
#stage{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:14px}
#stage.scroll{display:block;padding:0}
.cardimg{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain}
#stage.scroll img{display:block;width:100%;height:auto;margin:0}
.nav{display:flex;gap:8px;padding:14px}
.nav a{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700}
.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center;max-width:520px}
.empty p{color:var(--muted);line-height:1.6}
@media(max-width:600px){
  .hero h1{font-size:24px}.thumb{width:76px;height:76px}
  .viewer-title{font-size:14px}.controls button{font-size:12px;padding:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* 제목은 여기 한 곳에서만 바꾸면 됩니다. */
const episodeTitles = [
  "방학이 실력 차이를 만든다!",
  "제2화 제목",
  "제3화 제목",
  "제4화 제목",
  "제5화 제목",
  "제6화 제목",
  "제7화 제목",
  "제8화 제목",
  "제9화 제목",
  "제10화 제목",
  "제11화 제목",
  "제12화 제목",
  "제13화 제목"
];

const exts=["png","jpg","jpeg","webp"];
const app=document.getElementById("app");
const params=new URLSearchParams(location.search);
const ep=Number(params.get("episode")||0);

async function exists(url){
  try{return (await fetch(url,{cache:"no-store"})).ok}catch{return false}
}
async function findImage(epNum, cutNum){
  const num=String(cutNum).padStart(2,"0");
  for(const ext of exts){
    const url=`episodes/episode${epNum}/${num}.${ext}`;
    if(await exists(url)) return url;
  }
  return null;
}

async function showHome(){
  document.title="중학생활 꿀팁 웹툰";
  app.innerHTML=`<header><div class="bar"><div class="brand">중학생활 꿀팁 웹툰</div></div></header>
  <main class="wrap"><section class="hero"><h1>웹툰 회차</h1>
  <p>첫 번째 이미지가 들어간 회차만 자동으로 공개됩니다.</p></section>
  <section id="list" class="list"></section></main>`;
  const list=document.getElementById("list");
  for(let n=1;n<=13;n++){
    const img=await findImage(n,1);
    const el=document.createElement(img?"a":"div");
    el.className="card"+(img?"":" coming");
    if(img) el.href=`?episode=${n}`;
    el.innerHTML=`${img?`<img class="thumb" src="${img}" alt="${n}화 썸네일">`:`<div class="thumb"></div>`}
      <div class="meta"><div class="label">제${n}화</div>
      <div class="title">${episodeTitles[n-1]||`제${n}화`}</div>
      <div class="status">${img?"지금 보기":"이미지를 넣으면 자동 공개"}</div></div>`;
    list.appendChild(el);
  }
}

async function showViewer(n){
  if(n<1||n>13){location.href="./";return}
  const images=[];
  for(let i=1;i<=200;i++){
    const url=await findImage(n,i);
    if(!url) break;
    images.push(url);
  }

  let current=Math.min(Number(localStorage.getItem(`ep${n}cut`)||0),Math.max(images.length-1,0));
  let mode=localStorage.getItem("viewerMode")||"card";
  document.title=`제${n}화 ${episodeTitles[n-1]||""}`;
  app.innerHTML=`<div class="viewer">
    <div class="viewerbar">
      <div class="viewerrow">
        <a href="./">← 목록</a>
        <div class="viewer-title">제${n}화 · ${episodeTitles[n-1]||""}</div>
        <div class="controls">
          <button id="cardBtn">컷 보기</button>
          <button id="scrollBtn">세로 보기</button>
        </div>
      </div>
      <div id="progress" class="progress"></div>
    </div>
    <div id="stage"></div>
    <nav class="nav">
      <a href="${n>1?`?episode=${n-1}`:"./"}">← 이전화</a>
      <a href="./">목록</a>
      <a href="${n<13?`?episode=${n+1}`:"./"}">다음화 →</a>
    </nav>
  </div>`;

  const stage=document.getElementById("stage");
  const progress=document.getElementById("progress");
  const cardBtn=document.getElementById("cardBtn");
  const scrollBtn=document.getElementById("scrollBtn");

  function render(){
    cardBtn.classList.toggle("active",mode==="card");
    scrollBtn.classList.toggle("active",mode==="scroll");
    if(!images.length){
      stage.className="";
      stage.innerHTML=`<div class="empty"><h2>아직 이미지가 없습니다</h2>
      <p>episodes/episode${n} 폴더에 01.png, 02.png처럼 순서대로 넣어주세요.</p></div>`;
      progress.textContent="";
      return;
    }
    if(mode==="card"){
      stage.className="";
      stage.innerHTML=`<img class="cardimg" src="${images[current]}" alt="${current+1}번째 컷">`;
      progress.textContent=`${current+1} / ${images.length}`;
    }else{
      stage.className="scroll";
      stage.innerHTML=images.map((u,i)=>`<img src="${u}" alt="${i+1}번째 컷" loading="${i<2?"eager":"lazy"}">`).join("");
      progress.textContent=`총 ${images.length}컷`;
    }
  }
  function next(){if(mode==="card"&&current<images.length-1){current++;localStorage.setItem(`ep${n}cut`,current);render()}}
  function prev(){if(mode==="card"&&current>0){current--;localStorage.setItem(`ep${n}cut`,current);render()}}
  cardBtn.onclick=()=>{mode="card";localStorage.setItem("viewerMode",mode);render();scrollTo(0,0)};
  scrollBtn.onclick=()=>{mode="scroll";localStorage.setItem("viewerMode",mode);render();scrollTo(0,0)};
  document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev()});
  let sx=0;
  stage.addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});
  stage.addEventListener("touchend",e=>{const d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>45)(d<0?next():prev())},{passive:true});
  render();
}

ep ? showViewer(ep) : showHome();
</script>
</body>
</html>
