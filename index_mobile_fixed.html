<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>중학생활 꿀팁 웹툰</title>
  <style>
    :root{
      --bg:#f5f6fa;
      --card:#ffffff;
      --text:#22242a;
      --muted:#767d8a;
      --line:#e6e9ef;
      --point:#6d63ff;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .top{
      position:sticky;
      top:0;
      z-index:20;
      background:#fff;
      border-bottom:1px solid var(--line);
    }
    .top-inner{
      max-width:820px;
      margin:auto;
      padding:14px 16px;
      font-weight:900;
    }
    .wrap{
      max-width:760px;
      margin:auto;
      padding:24px 16px 70px;
    }
    .hero h1{margin:0 0 8px;font-size:28px}
    .hero p{margin:0 0 22px;color:var(--muted)}
    .list{display:grid;gap:14px}
    .episode{
      display:flex;
      align-items:center;
      gap:14px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
    }
    .thumb{
      width:92px;
      height:92px;
      border-radius:14px;
      object-fit:cover;
      background:#eceef3;
      flex:0 0 auto;
    }
    .meta{min-width:0;flex:1}
    .label{font-size:13px;color:var(--point);font-weight:900}
    .title{
      margin-top:5px;
      font-size:17px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .state{margin-top:8px;font-size:13px;color:var(--muted)}
    .empty{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:34px 20px;
      text-align:center;
      color:var(--muted);
    }

    .viewer{max-width:920px;margin:auto}
    .viewer-head{
      position:sticky;
      top:0;
      z-index:30;
      background:#fff;
      border-bottom:1px solid var(--line);
      padding:8px 10px 7px;
    }
    .viewer-row{
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      align-items:center;
      gap:10px;
    }
    .back-link{
      white-space:nowrap;
      font-weight:700;
    }
    .viewer-title{
      min-width:0;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      font-weight:900;
      text-align:center;
    }
    .mobile-title{display:none}
    .controls{
      display:flex;
      gap:6px;
      flex:0 0 auto;
    }
    .control{
      border:1px solid var(--line);
      background:#fff;
      border-radius:10px;
      padding:8px 10px;
      font-weight:800;
      cursor:pointer;
      white-space:nowrap;
    }
    .control.active{
      background:var(--point);
      color:#fff;
      border-color:var(--point);
    }
    .progress{
      margin-top:4px;
      text-align:center;
      font-size:12px;
      line-height:1.2;
      color:var(--muted);
    }
    .stage{
      min-height:calc(100svh - 88px);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:10px;
    }
    .stage.scroll{
      display:block;
      padding:0;
    }
    .card-img{
      display:block;
      max-width:100%;
      max-height:calc(100svh - 130px);
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
    }
    .stage.scroll img{
      display:block;
      width:100%;
      height:auto;
      margin:0 auto;
      background:#fff;
    }
    .cut-nav{
      display:flex;
      gap:8px;
      padding:10px 14px 14px;
    }
    .cut-nav button{
      flex:1;
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:11px;
      font-weight:800;
      cursor:pointer;
    }
    .cut-nav button:disabled{opacity:.4}
    .episode-nav{
      display:none;
      gap:8px;
      padding:0 14px 16px;
    }
    .episode-nav.show{display:flex}
    .episode-nav a{
      flex:1;
      text-align:center;
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:12px;
      font-weight:800;
    }
    .tap{
      position:fixed;
      top:78px;
      bottom:0;
      width:18%;
      z-index:10;
    }
    .tap.left{left:0}
    .tap.right{right:0}
    .loading{
      padding:60px 20px;
      text-align:center;
      color:var(--muted);
    }

    @media(max-width:600px){
      .thumb{width:78px;height:78px}

      .viewer-head{
        padding:6px 8px 5px;
      }
      .viewer-row{
        grid-template-columns:46px minmax(0,1fr) auto;
        gap:6px;
      }
      .back-link{
        font-size:0;
        width:46px;
      }
      .back-link::before{
        content:"←";
        font-size:24px;
        line-height:1;
      }
      .desktop-title{display:none}
      .mobile-title{
        display:block;
        font-size:15px;
      }
      .controls{gap:4px}
      .control{
        min-width:52px;
        padding:7px 8px;
        border-radius:9px;
        font-size:13px;
        line-height:1.15;
      }
      .progress{
        margin-top:3px;
        font-size:12px;
      }
      .stage{
        min-height:calc(100svh - 74px);
        padding:6px;
      }
      .card-img{
        max-height:calc(100svh - 110px);
      }
      .tap{
        top:68px;
        width:16%;
      }
      .cut-nav{
        padding:8px 10px 12px;
      }
      .cut-nav button{
        padding:10px 8px;
        font-size:15px;
      }
    }
  </style>
</head>
<body>
  <div id="app"><div class="loading">불러오는 중...</div></div>

  <script>
    const TOTAL_EPISODES = 13;
    const EXTENSIONS = ["png","jpg","jpeg","webp"];
    const app = document.getElementById("app");
    const params = new URLSearchParams(location.search);
    const selectedEpisode = Number(params.get("episode") || 0);
    let publishConfig = {};

    async function loadPublishConfig(){
      try{
        const response = await fetch("./publish.json?v=" + Date.now(), {cache:"no-store"});
        if(!response.ok) throw new Error("publish.json not found");
        publishConfig = await response.json();
      }catch(error){
        console.error(error);
        publishConfig = {};
      }
    }

    function isPublished(number){
      return publishConfig[String(number)] === true;
    }

    async function fileExists(url){
      try{
        const response = await fetch(url, {cache:"no-store"});
        return response.ok;
      }catch{
        return false;
      }
    }

    async function readTitle(number){
      try{
        const response = await fetch(
          `./episodes/episode${number}/title.txt?v=${Date.now()}`,
          {cache:"no-store"}
        );
        if(response.ok){
          const text = (await response.text()).trim();
          return text || `제${number}화`;
        }
      }catch{}
      return `제${number}화`;
    }

    async function findImage(number, cut){
      const fileNumber = String(cut).padStart(2,"0");
      for(const extension of EXTENSIONS){
        const url = `./episodes/episode${number}/${fileNumber}.${extension}`;
        if(await fileExists(url)) return url;
      }
      return null;
    }

    async function episodeReady(number){
      if(!isPublished(number)) return false;
      return Boolean(await findImage(number, 1));
    }

    async function findPreviousEpisode(number){
      for(let n = number - 1; n >= 1; n--){
        if(await episodeReady(n)) return n;
      }
      return null;
    }

    async function findNextEpisode(number){
      for(let n = number + 1; n <= TOTAL_EPISODES; n++){
        if(await episodeReady(n)) return n;
      }
      return null;
    }

    function escapeHtml(text){
      return String(text).replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char]));
    }

    async function showHome(){
      app.innerHTML = `
        <header class="top">
          <div class="top-inner">중학생활 꿀팁 웹툰</div>
        </header>
        <main class="wrap">
          <section class="hero">
            <h1>웹툰 회차</h1>
            <p>공개된 회차만 표시됩니다.</p>
          </section>
          <section id="episodeList" class="list"></section>
        </main>
      `;

      const list = document.getElementById("episodeList");
      let count = 0;

      for(let number = 1; number <= TOTAL_EPISODES; number++){
        if(!isPublished(number)) continue;

        const thumbnail = await findImage(number, 1);
        if(!thumbnail) continue;

        const title = await readTitle(number);
        const card = document.createElement("a");
        card.className = "episode";
        card.href = `?episode=${number}`;
        card.innerHTML = `
          <img class="thumb" src="${thumbnail}" alt="${number}화 썸네일">
          <div class="meta">
            <div class="label">제${number}화</div>
            <div class="title">${escapeHtml(title)}</div>
            <div class="state">지금 보기</div>
          </div>
        `;
        list.appendChild(card);
        count++;
      }

      if(count === 0){
        list.innerHTML = `
          <div class="empty">
            공개된 회차가 없거나 첫 번째 이미지 파일을 찾지 못했습니다.
          </div>
        `;
      }
    }

    async function showViewer(number){
      if(number < 1 || number > TOTAL_EPISODES || !isPublished(number)){
        location.href = "./";
        return;
      }

      const images = [];
      for(let cut = 1; cut <= 300; cut++){
        const image = await findImage(number, cut);
        if(!image) break;
        images.push(image);
      }

      if(images.length === 0){
        location.href = "./";
        return;
      }

      const title = await readTitle(number);
      const previousEpisode = await findPreviousEpisode(number);
      const nextEpisode = await findNextEpisode(number);

      let current = 0;
      let mode = localStorage.getItem("webtoon-view-mode") || "card";

      document.title = `제${number}화 ${title}`;

      app.innerHTML = `
        <div class="viewer">
          <header class="viewer-head">
            <div class="viewer-row">
              <a class="back-link" href="./">← 목록</a>

              <div class="viewer-title">
                <span class="desktop-title">제${number}화 · ${escapeHtml(title)}</span>
                <span class="mobile-title">제${number}화</span>
              </div>

              <div class="controls">
                <button id="cardMode" class="control">컷 보기</button>
                <button id="scrollMode" class="control">세로 보기</button>
              </div>
            </div>
            <div id="progress" class="progress"></div>
          </header>

          <main id="stage" class="stage"></main>

          <div id="cutNav" class="cut-nav">
            <button id="previousCut">← 이전 컷</button>
            <button id="nextCut">다음 컷 →</button>
          </div>

          <div id="episodeNav" class="episode-nav">
            ${
              previousEpisode
                ? `<a href="?episode=${previousEpisode}">← 이전화</a>`
                : `<a href="./">← 목록</a>`
            }
            <a href="./">목록</a>
            ${
              nextEpisode
                ? `<a href="?episode=${nextEpisode}">다음화 →</a>`
                : `<a href="./">마지막 화</a>`
            }
          </div>
        </div>

        <div id="leftTap" class="tap left"></div>
        <div id="rightTap" class="tap right"></div>
      `;

      const stage = document.getElementById("stage");
      const progress = document.getElementById("progress");
      const cutNav = document.getElementById("cutNav");
      const episodeNav = document.getElementById("episodeNav");
      const previousCutButton = document.getElementById("previousCut");
      const nextCutButton = document.getElementById("nextCut");
      const cardModeButton = document.getElementById("cardMode");
      const scrollModeButton = document.getElementById("scrollMode");

      function render(){
        cardModeButton.classList.toggle("active", mode === "card");
        scrollModeButton.classList.toggle("active", mode === "scroll");

        if(mode === "card"){
          stage.className = "stage";
          stage.innerHTML = `
            <img class="card-img" src="${images[current]}" alt="${current + 1}번째 컷">
          `;
          progress.textContent = `${current + 1} / ${images.length}`;
          cutNav.style.display = "flex";
          previousCutButton.disabled = current === 0;
          nextCutButton.disabled = current === images.length - 1;
          episodeNav.classList.toggle("show", current === images.length - 1);
        }else{
          stage.className = "stage scroll";
          stage.innerHTML = images.map((url, index) => `
            <img src="${url}" alt="${index + 1}번째 컷" loading="${index < 2 ? "eager" : "lazy"}">
          `).join("");
          progress.textContent = `총 ${images.length}컷`;
          cutNav.style.display = "none";
          episodeNav.classList.add("show");
        }
      }

      function goPreviousCut(){
        if(mode === "card" && current > 0){
          current--;
          render();
          window.scrollTo({top:0, behavior:"instant"});
        }
      }

      function goNextCut(){
        if(mode === "card" && current < images.length - 1){
          current++;
          render();
          window.scrollTo({top:0, behavior:"instant"});
        }
      }

      previousCutButton.onclick = goPreviousCut;
      nextCutButton.onclick = goNextCut;
      document.getElementById("leftTap").onclick = goPreviousCut;
      document.getElementById("rightTap").onclick = goNextCut;

      cardModeButton.onclick = () => {
        mode = "card";
        localStorage.setItem("webtoon-view-mode", mode);
        render();
        window.scrollTo(0,0);
      };

      scrollModeButton.onclick = () => {
        mode = "scroll";
        localStorage.setItem("webtoon-view-mode", mode);
        render();
        window.scrollTo(0,0);
      };

      let startX = 0;
      stage.addEventListener("touchstart", event => {
        startX = event.changedTouches[0].screenX;
      }, {passive:true});

      stage.addEventListener("touchend", event => {
        if(mode !== "card") return;
        const distance = event.changedTouches[0].screenX - startX;
        if(Math.abs(distance) > 45){
          distance < 0 ? goNextCut() : goPreviousCut();
        }
      }, {passive:true});

      render();
      window.scrollTo(0,0);
    }

    (async function start(){
      await loadPublishConfig();
      if(selectedEpisode){
        await showViewer(selectedEpisode);
      }else{
        await showHome();
      }
    })();
  </script>
</body>
</html>
