<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>중학생활 꿀팁 웹툰</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#22242a;--muted:#777e8c;--line:#e7e9ef;--point:#6d63ff;--soft:#efedff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.top-inner{max-width:840px;margin:auto;padding:14px 16px;font-weight:900}.wrap{max-width:760px;margin:auto;padding:24px 16px 70px}
.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0 0 20px;color:var(--muted)}
.list{display:grid;gap:13px}.episode{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.episode.locked{opacity:.55;pointer-events:none}.thumb{width:92px;height:92px;border-radius:14px;object-fit:cover;background:#eceef3}
.meta{flex:1;min-width:0}.label{font-size:13px;color:var(--point);font-weight:900}.title{font-size:17px;font-weight:900;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font-size:13px;color:var(--muted);margin-top:8px}.badge{font-size:12px;font-weight:800;padding:6px 8px;border-radius:999px;background:var(--soft);color:var(--point)}
.viewer{max-width:920px;margin:auto}.viewer-head{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding:11px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.viewer-title{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;gap:7px}.ctrl{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:800}.ctrl.active{background:var(--point);color:#fff}
.progress{text-align:center;font-size:13px;color:var(--muted);margin-top:7px}.stage{min-height:calc(100vh - 100px);display:flex;align-items:center;justify-content:center;padding:14px}
.stage.scroll{display:block;padding:0}.card-img{max-width:100%;max-height:calc(100vh - 145px);object-fit:contain;display:block}
.stage.scroll img{display:block;width:100%;height:auto}.cut-nav{display:flex;gap:8px;padding:12px 14px}.cut-nav button{flex:1;padding:11px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:800}
.episode-nav{display:none;gap:8px;padding:14px}.episode-nav.show{display:flex}.episode-nav a{flex:1;text-align:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;font-weight:800}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}.tap{position:fixed;top:92px;bottom:0;width:20%;z-index:10}.tap.left{left:0}.tap.right{right:0}
@media(max-width:600px){.thumb{width:78px;height:78px}.viewer-title{font-size:14px}.ctrl{font-size:12px;padding:8px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const TOTAL_EPISODES=13;
const EXTENSIONS=["png","jpg","jpeg","webp"];
const app=document.getElementById("app");
const params=new URLSearchParams(location.search);
const episodeNumber=Number(params.get("episode")||0);
let publishConfig={};

async function loadPublishConfig(){
  try{
    const r=await fetch("./publish.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("publish.json");
    publishConfig=await r.json();
  }catch(e){
    console.error(e);
    publishConfig={};
  }
}
function isPublished(n){
  const setting=publishConfig[String(n)];
  if(setting===true) return true;
  if(setting && typeof setting==="object") return setting.published===true;
  return false;
}
async function exists(url){
  try{return (await fetch(url,{cache:"no-store"})).ok}catch{return false}
}
async function readTitle(n){
  try{
    const r=await fetch(`./episodes/episode${n}/title.txt?ts=${Date.now()}`,{cache:"no-store"});
    if(r.ok){const t=(await r.text()).trim();return t||`제${n}화`}
  }catch{}
  return `제${n}화`;
}
async function findImage(n,cut){
  const num=String(cut).padStart(2,"0");
  for(const ext of EXTENSIONS){
    const url=`./episodes/episode${n}/${num}.${ext}`;
    if(await exists(url)) return url;
  }
  return null;
}
async function episodeAvailable(n){return isPublished(n)&&Boolean(await findImage(n,1))}
async function prevEpisode(n){for(let i=n-1;i>=1;i--)if(await episodeAvailable(i))return i;return null}
async function nextEpisode(n){for(let i=n+1;i<=TOTAL_EPISODES;i++)if(await episodeAvailable(i))return i;return null}

async function showHome(){
  app.innerHTML=`<header class="top"><div class="top-inner">중학생활 꿀팁 웹툰</div></header>
  <main class="wrap"><section class="hero"><h1>웹툰 회차</h1><p>매주 수요일 공개</p></section><section id="list" class="list"></section></main>`;
  const list=document.getElementById("list");
  for(let n=1;n<=TOTAL_EPISODES;n++){
    const title=await readTitle(n);
    const thumb=await findImage(n,1);
    const published=isPublished(n)&&Boolean(thumb);
    const card=document.createElement(published?"a":"div");
    card.className="episode"+(published?"":" locked");
    if(published) card.href=`?episode=${n}`;
    card.innerHTML=`${thumb?`<img class="thumb" src="${thumb}" alt="${n}화 썸네일">`:`<div class="thumb"></div>`}
      <div class="meta"><div class="label">제${n}화</div><div class="title">${title}</div>
      <div class="state">${published?"지금 보기":thumb?"비공개 상태":"이미지 준비 중"}</div></div>
      <span class="badge">${published?"공개":"비공개"}</span>`;
    list.appendChild(card);
  }
}
async function showViewer(n){
  if(n<1||n>TOTAL_EPISODES||!isPublished(n)){location.href="./";return}
  const images=[];
  for(let cut=1;cut<=300;cut++){const img=await findImage(n,cut);if(!img)break;images.push(img)}
  if(!images.length){location.href="./";return}
  const title=await readTitle(n);
  const prev=await prevEpisode(n), next=await nextEpisode(n);
  let current=Math.min(Number(localStorage.getItem(`episode-${n}-cut`)||0),images.length-1);
  let mode=localStorage.getItem("webtoon-view-mode")||"card";
  app.innerHTML=`<div class="viewer"><header class="viewer-head"><div class="row"><a href="./">← 목록</a>
  <div class="viewer-title">제${n}화 · ${title}</div><div class="controls"><button id="cardBtn" class="ctrl">컷 보기</button><button id="scrollBtn" class="ctrl">세로 보기</button></div></div>
  <div id="progress" class="progress"></div></header><main id="stage" class="stage"></main>
  <div id="cutNav" class="cut-nav"><button id="prevCut">← 이전 컷</button><button id="nextCut">다음 컷 →</button></div>
  <div id="episodeNav" class="episode-nav">${prev?`<a href="?episode=${prev}">← 이전화</a>`:`<a href="./">← 목록</a>`}<a href="./">목록</a>${next?`<a href="?episode=${next}">다음화 →</a>`:`<a href="./">마지막 화</a>`}</div></div>
  <div id="leftTap" class="tap left"></div><div id="rightTap" class="tap right"></div>`;
  const stage=document.getElementById("stage"),progress=document.getElementById("progress"),cutNav=document.getElementById("cutNav"),episodeNav=document.getElementById("episodeNav");
  const cardBtn=document.getElementById("cardBtn"),scrollBtn=document.getElementById("scrollBtn"),prevCut=document.getElementById("prevCut"),nextCut=document.getElementById("nextCut");
  function save(){localStorage.setItem(`episode-${n}-cut`,String(current))}
  function render(){
    cardBtn.classList.toggle("active",mode==="card");scrollBtn.classList.toggle("active",mode==="scroll");
    if(mode==="card"){
      stage.className="stage";stage.innerHTML=`<img class="card-img" src="${images[current]}" alt="${current+1}번째 컷">`;
      progress.textContent=`${current+1} / ${images.length}`;cutNav.style.display="flex";
      prevCut.disabled=current===0;nextCut.disabled=current===images.length-1;episodeNav.classList.toggle("show",current===images.length-1);
    }else{
      stage.className="stage scroll";stage.innerHTML=images.map((u,i)=>`<img src="${u}" alt="${i+1}번째 컷" loading="${i<2?"eager":"lazy"}">`).join("");
      progress.textContent=`총 ${images.length}컷`;cutNav.style.display="none";episodeNav.classList.add("show");
    }
  }
  function goNext(){if(mode==="card"&&current<images.length-1){current++;save();render()}}
  function goPrev(){if(mode==="card"&&current>0){current--;save();render()}}
  prevCut.onclick=goPrev;nextCut.onclick=goNext;document.getElementById("leftTap").onclick=goPrev;document.getElementById("rightTap").onclick=goNext;
  cardBtn.onclick=()=>{mode="card";localStorage.setItem("webtoon-view-mode",mode);render();scrollTo(0,0)};
  scrollBtn.onclick=()=>{mode="scroll";localStorage.setItem("webtoon-view-mode",mode);render();scrollTo(0,0)};
  let sx=0;stage.addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});
  stage.addEventListener("touchend",e=>{const d=e.changedTouches[0].screenX-sx;if(mode==="card"&&Math.abs(d)>45)(d<0?goNext:goPrev)()},{passive:true});
  save();render();
}
(async()=>{await loadPublishConfig();episodeNumber?showViewer(episodeNumber):showHome()})();
</script>
</body>
</html>
