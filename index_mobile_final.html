<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>중학생활 꿀팁 웹툰</title>
<style>
:root{
  --bg:#f5f6fa;
  --card:#fff;
  --text:#22242a;
  --muted:#777e8c;
  --line:#e7e9ef;
  --point:#6d63ff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
button:disabled{opacity:.4;cursor:not-allowed}

.site-head{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.site-head-inner{
  max-width:820px;
  margin:auto;
  padding:14px 16px;
  font-weight:900;
}
.home{
  max-width:760px;
  margin:auto;
  padding:24px 16px 70px;
}
.home h1{margin:0 0 8px;font-size:28px}
.home p{margin:0 0 22px;color:var(--muted)}
.episode-list{display:grid;gap:14px}
.episode-card{
  display:flex;
  align-items:center;
  gap:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}
.thumb{
  width:92px;
  height:92px;
  border-radius:14px;
  object-fit:cover;
  background:#eceef3;
  flex:0 0 auto;
}
.episode-meta{flex:1;min-width:0}
.episode-no{font-size:13px;color:var(--point);font-weight:900}
.episode-title{
  margin-top:5px;
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.episode-state{margin-top:8px;font-size:13px;color:var(--muted)}
.empty{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:34px 20px;
  text-align:center;
  color:var(--muted);
}

/* viewer */
.viewer{
  min-height:100vh;
  background:var(--bg);
}
.viewer-head{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.viewer-bar{
  max-width:920px;
  margin:auto;
  min-height:56px;
  padding:7px 10px;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
}
.back{
  white-space:nowrap;
  font-weight:800;
}
.viewer-title{
  min-width:0;
  text-align:center;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.controls{
  display:flex;
  gap:6px;
}
.mode{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:8px 10px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
.mode.active{
  background:var(--point);
  color:#fff;
  border-color:var(--point);
}
.progress{
  max-width:920px;
  margin:auto;
  padding:0 10px 6px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1;
}

.stage{
  max-width:920px;
  margin:auto;
  min-height:calc(100svh - 73px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
}
.stage.scroll{
  display:block;
  padding:0;
}
.card-img{
  display:block;
  max-width:100%;
  max-height:calc(100svh - 90px);
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
}
.stage.scroll img{
  display:block;
  width:100%;
  height:auto;
  margin:0 auto;
  background:#fff;
}
.bottom-nav{
  max-width:920px;
  margin:auto;
  display:flex;
  gap:8px;
  padding:8px 10px 14px;
}
.bottom-nav button{
  flex:1;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:11px;
  font-weight:800;
}
.episode-nav{
  max-width:920px;
  margin:auto;
  display:none;
  gap:8px;
  padding:0 10px 16px;
}
.episode-nav.show{display:flex}
.episode-nav a{
  flex:1;
  text-align:center;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:12px;
  font-weight:800;
}
.tap-zone{
  position:fixed;
  top:64px;
  bottom:0;
  width:17%;
  z-index:10;
}
.tap-zone.left{left:0}
.tap-zone.right{right:0}

@media(max-width:600px){
  .thumb{width:78px;height:78px}

  .viewer-bar{
    min-height:48px;
    grid-template-columns:36px minmax(0,1fr) auto;
    gap:6px;
    padding:5px 6px;
  }
  .back{
    font-size:0;
    width:36px;
    text-align:center;
  }
  .back::before{
    content:"←";
    font-size:22px;
    line-height:1;
  }
  .viewer-title{
    font-size:14px;
  }
  .viewer-title .full{display:none}
  .controls{gap:4px}
  .mode{
    min-width:48px;
    padding:6px 7px;
    border-radius:9px;
    font-size:12px;
    line-height:1.15;
  }
  .progress{
    padding-bottom:4px;
    font-size:11px;
  }
  .stage{
    min-height:calc(100svh - 61px);
    padding:4px;
  }
  .card-img{
    max-height:calc(100svh - 72px);
  }
  .bottom-nav{
    padding:6px 8px 10px;
  }
  .bottom-nav button{
    padding:9px 6px;
    font-size:14px;
  }
  .tap-zone{
    top:56px;
    width:15%;
  }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const TOTAL_EPISODES = 13;
const EXTENSIONS = ["png","jpg","jpeg","webp"];
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const selectedEpisode = Number(params.get("episode") || 0);
let publishConfig = {};

async function loadPublishConfig(){
  try{
    const response = await fetch("./publish.json?v=" + Date.now(), {cache:"no-store"});
    if(!response.ok) throw new Error("publish.json not found");
    publishConfig = await response.json();
  }catch(error){
    console.error(error);
    publishConfig = {};
  }
}
function isPublished(n){
  return publishConfig[String(n)] === true;
}
async function exists(url){
  try{
    return (await fetch(url,{cache:"no-store"})).ok;
  }catch{
    return false;
  }
}
async function readTitle(n){
  try{
    const response = await fetch(`./episodes/episode${n}/title.txt?v=${Date.now()}`,{cache:"no-store"});
    if(response.ok){
      const text = (await response.text()).trim();
      return text || `제${n}화`;
    }
  }catch{}
  return `제${n}화`;
}
async function findImage(n,cut){
  const num = String(cut).padStart(2,"0");
  for(const ext of EXTENSIONS){
    const url = `./episodes/episode${n}/${num}.${ext}`;
    if(await exists(url)) return url;
  }
  return null;
}
async function episodeReady(n){
  return isPublished(n) && Boolean(await findImage(n,1));
}
async function previousEpisode(n){
  for(let i=n-1;i>=1;i--) if(await episodeReady(i)) return i;
  return null;
}
async function nextEpisode(n){
  for(let i=n+1;i<=TOTAL_EPISODES;i++) if(await episodeReady(i)) return i;
  return null;
}
function escapeHtml(text){
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function showHome(){
  app.innerHTML = `
    <header class="site-head"><div class="site-head-inner">중학생활 꿀팁 웹툰</div></header>
    <main class="home">
      <h1>웹툰 회차</h1>
      <p>공개된 회차만 표시됩니다.</p>
      <section id="episodeList" class="episode-list"></section>
    </main>
  `;
  const list = document.getElementById("episodeList");
  let count = 0;

  for(let n=1;n<=TOTAL_EPISODES;n++){
    if(!isPublished(n)) continue;
    const thumbnail = await findImage(n,1);
    if(!thumbnail) continue;
    const title = await readTitle(n);

    const card = document.createElement("a");
    card.className = "episode-card";
    card.href = `?episode=${n}`;
    card.innerHTML = `
      <img class="thumb" src="${thumbnail}" alt="${n}화 썸네일">
      <div class="episode-meta">
        <div class="episode-no">제${n}화</div>
        <div class="episode-title">${escapeHtml(title)}</div>
        <div class="episode-state">지금 보기</div>
      </div>
    `;
    list.appendChild(card);
    count++;
  }

  if(count===0){
    list.innerHTML = `<div class="empty">공개된 회차가 없거나 첫 이미지 파일을 찾지 못했습니다.</div>`;
  }
}

async function showViewer(n){
  if(n<1 || n>TOTAL_EPISODES || !isPublished(n)){
    location.href="./";
    return;
  }

  const images=[];
  for(let cut=1;cut<=300;cut++){
    const img = await findImage(n,cut);
    if(!img) break;
    images.push(img);
  }
  if(!images.length){
    location.href="./";
    return;
  }

  const title = await readTitle(n);
  const prevEp = await previousEpisode(n);
  const nextEp = await nextEpisode(n);

  let current = 0; // 항상 첫 컷부터 시작
  let mode = localStorage.getItem("webtoon-view-mode") || "card";

  app.innerHTML = `
    <div class="viewer">
      <header class="viewer-head">
        <div class="viewer-bar">
          <a class="back" href="./">← 목록</a>

          <div class="viewer-title">
            <span class="full">제${n}화 · ${escapeHtml(title)}</span>
            <span class="short">제${n}화</span>
          </div>

          <div class="controls">
            <button id="cardMode" class="mode">컷 보기</button>
            <button id="scrollMode" class="mode">세로 보기</button>
          </div>
        </div>
        <div id="progress" class="progress"></div>
      </header>

      <main id="stage" class="stage"></main>

      <div id="bottomNav" class="bottom-nav">
        <button id="prevCut">← 이전 컷</button>
        <button id="nextCut">다음 컷 →</button>
      </div>

      <div id="episodeNav" class="episode-nav">
        ${prevEp ? `<a href="?episode=${prevEp}">← 이전화</a>` : `<a href="./">← 목록</a>`}
        <a href="./">목록</a>
        ${nextEp ? `<a href="?episode=${nextEp}">다음화 →</a>` : `<a href="./">마지막 화</a>`}
      </div>
    </div>

    <div id="leftTap" class="tap-zone left"></div>
    <div id="rightTap" class="tap-zone right"></div>
  `;

  const stage = document.getElementById("stage");
  const progress = document.getElementById("progress");
  const bottomNav = document.getElementById("bottomNav");
  const episodeNav = document.getElementById("episodeNav");
  const prevCut = document.getElementById("prevCut");
  const nextCut = document.getElementById("nextCut");
  const cardMode = document.getElementById("cardMode");
  const scrollMode = document.getElementById("scrollMode");

  function jumpTop(){
    window.scrollTo({top:0,left:0,behavior:"instant"});
  }

  function render(){
    cardMode.classList.toggle("active", mode==="card");
    scrollMode.classList.toggle("active", mode==="scroll");

    if(mode==="card"){
      stage.className="stage";
      stage.innerHTML=`<img class="card-img" src="${images[current]}" alt="${current+1}번째 컷">`;
      progress.textContent=`${current+1} / ${images.length}`;
      bottomNav.style.display="flex";
      prevCut.disabled=current===0;
      nextCut.disabled=current===images.length-1;
      episodeNav.classList.toggle("show", current===images.length-1);
    }else{
      stage.className="stage scroll";
      stage.innerHTML=images.map((url,i)=>`<img src="${url}" alt="${i+1}번째 컷" loading="${i<2?"eager":"lazy"}">`).join("");
      progress.textContent=`총 ${images.length}컷`;
      bottomNav.style.display="none";
      episodeNav.classList.add("show");
    }
  }

  function goPrev(){
    if(mode==="card" && current>0){
      current--;
      render();
      jumpTop();
    }
  }

  function goNext(){
    if(mode==="card" && current<images.length-1){
      current++;
      render();
      jumpTop();
    }
  }

  prevCut.onclick=goPrev;
  nextCut.onclick=goNext;
  document.getElementById("leftTap").onclick=goPrev;
  document.getElementById("rightTap").onclick=goNext;

  cardMode.onclick=()=>{
    mode="card";
    localStorage.setItem("webtoon-view-mode",mode);
    render();
    jumpTop();
  };

  scrollMode.onclick=()=>{
    mode="scroll";
    localStorage.setItem("webtoon-view-mode",mode);
    render();
    jumpTop();
  };

  let startX=0;
  stage.addEventListener("touchstart",e=>{
    startX=e.changedTouches[0].screenX;
  },{passive:true});

  stage.addEventListener("touchend",e=>{
    if(mode!=="card") return;
    const distance=e.changedTouches[0].screenX-startX;
    if(Math.abs(distance)>45){
      distance<0 ? goNext() : goPrev();
    }
  },{passive:true});

  render();
  jumpTop();
}

(async()=>{
  await loadPublishConfig();
  selectedEpisode ? await showViewer(selectedEpisode) : await showHome();
})();
</script>
</body>
</html>
