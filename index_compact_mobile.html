<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<title>중학생활 꿀팁 웹툰</title>
<style>
:root{
  --bg:#f5f6fa;
  --card:#ffffff;
  --text:#22242a;
  --muted:#777e8c;
  --line:#e7e9ef;
  --point:#6d63ff;
  --point-soft:#efedff;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
button:disabled{opacity:.4;cursor:not-allowed}

.top{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-inner{
  max-width:840px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{font-weight:900;font-size:17px}
.wrap{max-width:760px;margin:auto;padding:24px 16px 70px}
.hero{padding:8px 2px 22px}
.hero h1{font-size:29px;margin:0 0 9px}
.hero p{color:var(--muted);line-height:1.65;margin:0}
.episode-list{display:grid;gap:13px}
.episode{
  display:flex;
  gap:14px;
  align-items:center;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:0 5px 18px rgba(31,35,48,.04);
  transition:transform .15s ease;
}
.episode:hover{transform:translateY(-1px)}
.episode.locked{opacity:.55;pointer-events:none}
.thumb{
  width:94px;
  height:94px;
  border-radius:14px;
  object-fit:cover;
  background:#eceef3;
  flex:0 0 auto;
}
.meta{flex:1;min-width:0}
.label{font-size:13px;color:var(--point);font-weight:900}
.title{
  font-size:17px;
  font-weight:900;
  margin-top:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.state{font-size:13px;color:var(--muted);margin-top:8px}
.badge{
  font-size:12px;
  font-weight:800;
  padding:6px 8px;
  border-radius:999px;
  background:var(--point-soft);
  color:var(--point);
}

.viewer{
  max-width:920px;
  min-height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
}
.viewer-head{
  position:sticky;
  top:0;
  z-index:40;
  flex:0 0 auto;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:6px 10px 5px;
}
.viewer-row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
  min-height:38px;
}
.viewer-row > a{
  white-space:nowrap;
  font-size:14px;
  font-weight:800;
}
.viewer-title{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:center;
  font-size:15px;
  font-weight:900;
}
.controls{
  display:flex;
  gap:5px;
  white-space:nowrap;
}
.ctrl{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:7px 9px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}
.ctrl.active{
  background:var(--point);
  color:#fff;
  border-color:var(--point);
}
.progress{
  height:16px;
  margin-top:1px;
  text-align:center;
  font-size:12px;
  line-height:16px;
  color:var(--muted);
}
.stage{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 10px;
  position:relative;
}
.stage.scroll{
  display:block;
  flex:none;
  min-height:0;
  padding:0;
}
.card-wrap{
  width:100%;
  height:100%;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card-img{
  display:block;
  max-width:100%;
  max-height:calc(100dvh - 116px);
  object-fit:contain;
  background:#fff;
  user-select:none;
  -webkit-user-drag:none;
}
.stage.scroll img{
  display:block;
  width:100%;
  height:auto;
  margin:0 auto;
  background:#fff;
}
.cut-nav{
  position:sticky;
  bottom:0;
  z-index:35;
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:7px 10px max(7px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);
  border-top:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.cut-nav button{
  flex:1;
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:9px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
.episode-nav{
  display:none;
  gap:8px;
  padding:10px 12px max(12px,env(safe-area-inset-bottom));
  background:#fff;
}
.episode-nav.show{display:flex}
.episode-nav a{
  flex:1;
  text-align:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 6px;
  font-size:13px;
  font-weight:800;
}
.next-episode{
  margin:14px;
  padding:18px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  text-align:center;
}
.next-episode h3{margin:0 0 8px}
.next-episode p{margin:0 0 14px;color:var(--muted)}
.next-episode a{
  display:block;
  background:var(--point);
  color:#fff;
  border-radius:12px;
  padding:13px;
  font-weight:900;
}
.empty{
  max-width:520px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:30px 22px;
  text-align:center;
}
.empty h2{margin-top:0}
.empty p{color:var(--muted);line-height:1.65}
.tapzone{
  position:fixed;
  top:66px;
  bottom:52px;
  width:18%;
  z-index:10;
}
.tapzone.left{left:0}
.tapzone.right{right:0}

@media(max-width:600px){
  .viewer-head{padding:5px 7px 3px}
  .viewer-row{
    grid-template-columns:50px minmax(0,1fr) auto;
    gap:4px;
    min-height:36px;
  }
  .viewer-row > a{
    font-size:0;
  }
  .viewer-row > a::after{
    content:"← 목록";
    font-size:12px;
  }
  .viewer-title{
    font-size:13px;
  }
  .controls{gap:3px}
  .ctrl{
    padding:6px 7px;
    border-radius:8px;
    font-size:0;
  }
  #cardBtn::after{content:"컷";font-size:12px}
  #scrollBtn::after{content:"세로";font-size:12px}
  .progress{
    height:14px;
    line-height:14px;
    font-size:11px;
  }
  .stage{padding:4px}
  .card-img{
    max-height:calc(100dvh - 100px);
  }
  .cut-nav{
    padding:6px 7px max(6px,env(safe-area-inset-bottom));
  }
  .cut-nav button{
    padding:8px 4px;
    font-size:13px;
  }
  .tapzone{
    top:58px;
    bottom:48px;
    width:16%;
  }
}

</style>
</head>
<body>
<div id="app"></div>

<script>
const TOTAL_EPISODES = 13;
const EXTENSIONS = ["png","jpg","jpeg","webp"];

let publishConfig = {};

async function loadPublishConfig(){
  try{
    const response = await fetch("publish.json",{cache:"no-store"});
    if(response.ok){
      publishConfig = await response.json();
    }
  }catch{
    publishConfig = {};
  }
}

function isPublished(n){
  const setting = publishConfig[String(n)];
  if (setting === true) return true;
  if (setting && typeof setting === "object") {
    return setting.published === true;
  }
  return false;
}
const app = document.getElementById("app");
const query = new URLSearchParams(location.search);
const episodeNumber = Number(query.get("episode") || 0);

async function exists(url){
  try{
    const response = await fetch(url,{cache:"no-store"});
    return response.ok;
  }catch{
    return false;
  }
}

async function readTitle(n){
  try{
    const response = await fetch(`episodes/episode${n}/title.txt`,{cache:"no-store"});
    if(response.ok){
      const text = (await response.text()).trim();
      return text || `제${n}화`;
    }
  }catch{}
  return `제${n}화`;
}

async function findImage(n,cut){
  const number = String(cut).padStart(2,"0");
  for(const ext of EXTENSIONS){
    const url = `episodes/episode${n}/${number}.${ext}`;
    if(await exists(url)) return url;
  }
  return null;
}

async function episodePublished(n){
  if(!isPublished(n)) return false;
  return Boolean(await findImage(n,1));
}

async function findNextPublishedEpisode(current){
  for(let n=current+1;n<=TOTAL_EPISODES;n++){
    if(await episodePublished(n)) return n;
  }
  return null;
}

async function findPreviousPublishedEpisode(current){
  for(let n=current-1;n>=1;n--){
    if(await episodePublished(n)) return n;
  }
  return null;
}

async function showHome(){
  document.title = "중학생활 꿀팁 웹툰";
  app.innerHTML = `
    <header class="top">
      <div class="top-inner">
        <div class="brand">중학생활 꿀팁 웹툰</div>
      </div>
    </header>
    <main class="wrap">
      <section class="hero">
        <h1>웹툰 회차</h1>
        <p>이미지가 준비된 회차만 자동으로 공개됩니다.</p>
      </section>
      <section id="episodeList" class="episode-list"></section>
    </main>
  `;

  const list = document.getElementById("episodeList");

  for(let n=1;n<=TOTAL_EPISODES;n++){
    const [title,thumbnail] = await Promise.all([
      readTitle(n),
      findImage(n,1)
    ]);

    const published = isPublished(n) && Boolean(thumbnail);

    const card = document.createElement(published ? "a" : "div");
    card.className = "episode" + (published ? "" : " locked");

    if(published){
      card.href = `?episode=${n}`;
    }

    card.innerHTML = `
      ${
        thumbnail
        ? `<img class="thumb" src="${thumbnail}" alt="${n}화 썸네일">`
        : `<div class="thumb"></div>`
      }
      <div class="meta">
        <div class="label">제${n}화</div>
        <div class="title">${title}</div>
        <div class="state">
          ${
            published
            ? "지금 보기"
            : thumbnail
              ? "비공개 상태"
              : "이미지 준비 중"
          }
        </div>
      </div>
      <span class="badge">${published ? "공개" : "비공개"}</span>
    `;

    list.appendChild(card);
  }
}

async function showViewer(n){
  if(n < 1 || n > TOTAL_EPISODES){
    location.href="./";
    return;
  }

  if(!isPublished(n)){
    location.href="./";
    return;
  }

  const title = await readTitle(n);
  const images = [];

  for(let cut=1;cut<=300;cut++){
    const image = await findImage(n,cut);
    if(!image) break;
    images.push(image);
  }

  const savedCut = Number(localStorage.getItem(`episode-${n}-cut`) || 0);
  let current = Math.min(savedCut, Math.max(images.length - 1, 0));
  let mode = localStorage.getItem("webtoon-view-mode") || "card";

  const previousEpisode = await findPreviousPublishedEpisode(n);
  const nextEpisode = await findNextPublishedEpisode(n);

  document.title = `제${n}화 ${title}`;

  app.innerHTML = `
    <div class="viewer">
      <header class="viewer-head">
        <div class="viewer-row">
          <a href="./">← 목록</a>

          <div class="viewer-title">제${n}화 · ${title}</div>

          <div class="controls">
            <button id="cardBtn" class="ctrl">컷 보기</button>
            <button id="scrollBtn" class="ctrl">세로 보기</button>
          </div>
        </div>

        <div id="progress" class="progress"></div>
      </header>

      <main id="stage" class="stage"></main>

      <div id="cutNav" class="cut-nav">
        <button id="prevCutBtn">← 이전 컷</button>
        <button id="nextCutBtn">다음 컷 →</button>
      </div>

      <div id="episodeNav" class="episode-nav">
        ${
          previousEpisode
          ? `<a href="?episode=${previousEpisode}">← 이전화</a>`
          : `<a href="./">← 목록</a>`
        }
        <a href="./">목록</a>
        ${
          nextEpisode
          ? `<a href="?episode=${nextEpisode}">다음화 →</a>`
          : `<a href="./">마지막 화</a>`
        }
      </div>
    </div>

    <div id="leftZone" class="tapzone left"></div>
    <div id="rightZone" class="tapzone right"></div>
  `;

  const stage = document.getElementById("stage");
  const progress = document.getElementById("progress");
  const cardBtn = document.getElementById("cardBtn");
  const scrollBtn = document.getElementById("scrollBtn");
  const cutNav = document.getElementById("cutNav");
  const episodeNav = document.getElementById("episodeNav");
  const prevCutBtn = document.getElementById("prevCutBtn");
  const nextCutBtn = document.getElementById("nextCutBtn");
  const leftZone = document.getElementById("leftZone");
  const rightZone = document.getElementById("rightZone");

  function save(){
    localStorage.setItem(`episode-${n}-cut`, String(current));
    localStorage.setItem("last-read-episode", String(n));
  }

  function render(){
    cardBtn.classList.toggle("active", mode==="card");
    scrollBtn.classList.toggle("active", mode==="scroll");

    if(!images.length){
      stage.className = "stage";
      stage.innerHTML = `
        <div class="empty">
          <h2>아직 이미지가 없습니다</h2>
          <p>
            <b>episodes/episode${n}</b> 폴더에
            01.png, 02.png처럼 순서대로 넣어주세요.
          </p>
        </div>
      `;
      progress.textContent = "";
      cutNav.style.display = "none";
      episodeNav.classList.remove("show");
      return;
    }

    if(mode==="card"){
      stage.className = "stage";
      stage.innerHTML = `
        <div class="card-wrap">
          <img class="card-img"
               src="${images[current]}"
               alt="${current+1}번째 컷">
        </div>
      `;

      progress.textContent = `${current+1} / ${images.length}`;
      cutNav.style.display = "flex";

      prevCutBtn.disabled = current === 0;
      nextCutBtn.disabled = current === images.length - 1;

      episodeNav.classList.toggle("show", current === images.length - 1);

    }else{
      stage.className = "stage scroll";

      let scrollHtml = images.map((url,i)=>`
        <img src="${url}"
             alt="${i+1}번째 컷"
             loading="${i<2 ? "eager" : "lazy"}">
      `).join("");

      if(nextEpisode){
        scrollHtml += `
          <section class="next-episode">
            <h3>이번 화를 모두 읽었어요</h3>
            <p>다음 화가 준비되어 있습니다.</p>
            <a href="?episode=${nextEpisode}">다음 화 보기 →</a>
          </section>
        `;
      }

      stage.innerHTML = scrollHtml;
      progress.textContent = `총 ${images.length}컷`;
      cutNav.style.display = "none";
      episodeNav.classList.add("show");
    }
  }

  function nextCut(){
    if(mode !== "card") return;
    if(current >= images.length - 1) return;

    current++;
    save();
    render();
  }

  function previousCut(){
    if(mode !== "card") return;
    if(current <= 0) return;

    current--;
    save();
    render();
  }

  cardBtn.onclick = ()=>{
    mode = "card";
    localStorage.setItem("webtoon-view-mode", mode);
    render();
    window.scrollTo(0,0);
  };

  scrollBtn.onclick = ()=>{
    mode = "scroll";
    localStorage.setItem("webtoon-view-mode", mode);
    render();
    window.scrollTo(0,0);
  };

  prevCutBtn.onclick = previousCut;
  nextCutBtn.onclick = nextCut;

  leftZone.onclick = previousCut;
  rightZone.onclick = nextCut;

  document.addEventListener("keydown", event=>{
    if(event.key === "ArrowRight") nextCut();
    if(event.key === "ArrowLeft") previousCut();
  });

  let startX = 0;

  stage.addEventListener("touchstart", event=>{
    startX = event.changedTouches[0].screenX;
  },{passive:true});

  stage.addEventListener("touchend", event=>{
    if(mode !== "card") return;

    const distance = event.changedTouches[0].screenX - startX;

    if(Math.abs(distance) > 45){
      distance < 0 ? nextCut() : previousCut();
    }
  },{passive:true});

  save();
  render();
}

(async()=>{
  await loadPublishConfig();
  episodeNumber ? showViewer(episodeNumber) : showHome();
})();
</script>
</body>
</html>
